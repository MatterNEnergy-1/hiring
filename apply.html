<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Career | Matter + Energy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07090f;
      --text:#f5f7ff;
      --muted:#c7cbe3;
      --line:rgba(255,255,255,.12);
      --accent:#FD6262;
      --btn:#ffffff;
      --btnText:#0b1020;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container{max-width:1100px;margin:0 auto;padding:0 18px}
    .btn{margin-top:16px;width:100%;padding:13px 14px;border-radius:999px;border:0;background: var(--btn);color: var(--btnText);font-weight:800;font-size:14px;cursor:pointer}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:14px;padding:12px;border-radius:14px;display:none;font-size:13.5px;border:1px solid rgba(255,255,255,.14);background: rgba(255,255,255,.04);}
  </style>
</head>

<body>

<main class="container" style="padding:60px 0;">
  <h1>Join Our Team</h1>

  <form id="appForm">
    <input name="firstName" placeholder="First Name" required><br><br>
    <input name="lastName" placeholder="Last Name" required><br><br>
    <input name="email" type="email" placeholder="Email" required><br><br>
    <input name="phone" placeholder="Phone"><br><br>

    <select name="role" required>
      <option value="">Select Role</option>
      <option>Data and Automation</option>
      <option>Growth Marketing</option>
      <option>Software Engineering</option>
      <option>MLOps / AI Infrastructure</option>
    </select><br><br>

    <input name="linkedin" placeholder="LinkedIn URL"><br><br>
    <input name="resumeFile" type="file" accept=".pdf,.doc,.docx" required><br><br>
    <textarea name="notes" placeholder="Notes (optional)"></textarea><br><br>

    <button class="btn" id="submitBtn" type="submit">Submit</button>
    <div id="msg" class="msg"></div>
  </form>
</main>

<script>
  // ✅ NEW DEPLOYMENT URL
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzb_ouYN_axb4_jbD0mXWeCYrMPCgnrT7JAcblzUy00B_9uJiOjKqtrBdDXub5Xw6-_/exec";

  const form = document.getElementById("appForm");
  const msg  = document.getElementById("msg");
  const btn  = document.getElementById("submitBtn");

  function showMessage(text, ok=true) {
    msg.textContent = text;
    msg.style.display = "block";
    msg.style.borderColor = ok ? "rgba(40,255,120,.22)" : "rgba(255,90,90,.26)";
    msg.style.background = ok ? "rgba(40,255,120,.10)" : "rgba(255,90,90,.12)";
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve((reader.result.split(",")[1] || ""));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const GENERIC_MSG =
      "Thanks — if you don’t receive a confirmation email within a few minutes, please resubmit.";

    const fd = new FormData(form);
    const file = fd.get("resumeFile");

    if (!file || !file.name) {
      showMessage("Please attach a resume file.", false);
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      showMessage("Please upload a resume under 5MB.", false);
      return;
    }

    btn.disabled = true;
    btn.textContent = "Submitting…";

    try {
      const payload = {
        firstName: fd.get("firstName"),
        lastName:  fd.get("lastName"),
        email:     fd.get("email"),
        role:      fd.get("role"),
        phone:     fd.get("phone") || "",
        linkedin:  fd.get("linkedin") || "",
        notes:     fd.get("notes") || "",
        source:    "Website",
        fileName:  file.name,
        mimeType:  file.type || "application/octet-stream",
        fileBase64: await fileToBase64(file)
      };

      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      const raw = await res.text();
      let json;

      try {
        json = JSON.parse(raw);
      } catch {
        console.error("Non-JSON response:", raw);
        showMessage(GENERIC_MSG, true);
        return;
      }

      if (json && json.ok) {
        form.reset();
        showMessage(json.message || "Application submitted successfully.", true);
      } else {
        showMessage((json && json.message) || GENERIC_MSG, true);
      }

    } catch (err) {
      console.error(err);
      showMessage(GENERIC_MSG, true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  });
</script>

</body>
</html>
